apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fakebric-backups
  namespace: fakebric-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fakebric-backup
  namespace: fakebric-system
spec:
  schedule: "17 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: backup
            image: busybox:1.36.1
            command: ["sh", "-c", "set -eu; mkdir -p /backup; out=/backup/fakebric-$(date -u +%Y%m%dT%H%M%SZ).tar.gz; tar -czf $out -C /data .; find /backup -type f -mtime +14 -delete; ls -lh $out"]
            volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: backups, mountPath: /backup}
            resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
            securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumes:
          - {name: data, persistentVolumeClaim: {claimName: fakebric-data}}
          - {name: backups, persistentVolumeClaim: {claimName: fakebric-backups}}
