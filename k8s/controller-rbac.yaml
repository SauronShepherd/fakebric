apiVersion: v1
kind: ServiceAccount
metadata:
  name: fakebric-session-controller
  namespace: fakebric-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fakebric-session-controller
  namespace: fakebric-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fakebric-session-controller
  namespace: fakebric-system
subjects:
- kind: ServiceAccount
  name: fakebric-session-controller
  namespace: fakebric-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fakebric-session-controller
