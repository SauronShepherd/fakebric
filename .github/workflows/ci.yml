name: Fakebrick CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=fakebric --cov-report=term-missing --cov-fail-under=75
      - name: Static checks
        shell: bash
        run: |
          python -m compileall -q fakebric tools tests runtime/runtime_versions.py
          python tools/production_gate.py --profile local
          python -m json.tool runtime/native-sbom.spdx.json >/dev/null
          node --check fakebric/static/app.js
  images-and-manifests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fakebric:ci
      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller.Dockerfile
          push: false
          load: true
          tags: fakebric-controller:ci
      - name: Build JVM runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: false
          load: true
          tags: fakebric-runtime:ci
      - name: Validate JVM runtime versions, architecture and non-root identity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python fakebric-runtime:ci /opt/fakebric/runtime_versions.py > jvm-runtime-versions.json
          grep -Fq '"python": "3.11.' jvm-runtime-versions.json
          grep -Fq '11.0.' jvm-runtime-versions.json
          grep -Fq '3.5.5' jvm-runtime-versions.json
          grep -Fq '"architecture": "x86_64"' jvm-runtime-versions.json
          grep -Fq '"uid": 10001' jvm-runtime-versions.json
          grep -Fq '"nativeRuntimePresent": false' jvm-runtime-versions.json
          grep -Fq '"nativeExecutionEnabled": "false"' jvm-runtime-versions.json
          docker run --rm --entrypoint sh fakebric-runtime:ci -c 'test -w /workspace && test -w /tmp/spark && tini --version >/dev/null 2>&1'
      - name: Execute Spark notebook smoke test on JVM runtime
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/fakebric-runtime-smoke"
          mkdir -p "$smoke_dir"
          cp runtime/spark_smoke.ipynb "$smoke_dir/spark_smoke.ipynb"
          chmod 777 "$smoke_dir"
          chmod 666 "$smoke_dir/spark_smoke.ipynb"
          docker run --rm --user 10001:10001 \
            -v "$smoke_dir:/workspace/runtime" \
            --entrypoint python fakebric-runtime:ci \
            /opt/fakebric/execute_notebook.py /workspace/runtime/spark_smoke.ipynb --timeout 120
          grep -q "fakebric-spark-ok" "$smoke_dir/spark_smoke.ipynb"
      - name: Build native-capable runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/native.Dockerfile
          push: false
          load: true
          tags: fakebric-runtime-native:ci
      - name: Validate native runtime inventory while native stays disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python fakebric-runtime-native:ci /opt/fakebric/runtime_versions.py > native-runtime-versions.json
          grep -Fq '"python": "3.11.' native-runtime-versions.json
          grep -Fq '17.0.20' native-runtime-versions.json
          grep -Fq '3.5.5' native-runtime-versions.json
          grep -Fq '"architecture": "x86_64"' native-runtime-versions.json
          grep -Fq '"uid": 10001' native-runtime-versions.json
          grep -Fq '"nativeRuntimePresent": true' native-runtime-versions.json
          grep -Fq '"nativeExecutionEnabled": "false"' native-runtime-versions.json
          grep -Fq 'gluten=1.6.0' native-runtime-versions.json
          grep -Fq 'velox=34338bfe5a95c895c90bb8fbbe2dfeeb04466087' native-runtime-versions.json
          docker run --rm --entrypoint sh fakebric-runtime-native:ci -c 'test -w /workspace && test -w /tmp/spark && tini --version >/dev/null 2>&1 && test -s /opt/fakebric/native-sbom.spdx.json && test -s /opt/fakebric/native-artifact-checksums.txt && find /opt/gluten -type f -name "*.so*" -print -quit | grep -q .'
      - name: Start Spark JVM path inside native-capable image with plugin disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --memory=3g --cpus=2 --entrypoint python fakebric-runtime-native:ci -c 'from pyspark.sql import SparkSession; s=SparkSession.builder.master("local[1]").appName("fakebric-day2-jvm-smoke").config("spark.ui.enabled","false").getOrCreate(); assert s.range(10).count() == 10; assert s.conf.get("spark.plugins", "") == ""; print("fakebric-native-image-jvm-path-ok"); s.stop()'
      - name: Validate Kubernetes manifest YAML structure offline
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_k8s_manifests.py k8s/*.yaml
      - name: Verify controller image pin consistency
        shell: bash
        run: |
          expected='fakebric/controller:dev-20260901-v13'
          grep -Fq "image: $expected" k8s/controller-deployment.yaml
          grep -Fq "ControllerImage = \"$expected\"" dev-up.ps1
          grep -Fq "CONTROLLER_IMAGE ?= $expected" Makefile
